defaults:
  - _self_
  - dset: default
  - solver: default

device: cuda
dtype: float32
autocast: false
autocast_dtype: bfloat16
seed: 2036
show: false
continue_from:
execute_only:
execute_inplace: false
benchmark_no_load: false

num_threads: 1
mp_start_method: forkserver

label:

logging:
  level: INFO
  log_updates: 10
  log_tensorboard: false
  log_wandb: false
tensorboard:
  with_media_logging: false
  name:
  sub_dir:
wandb:
  with_media_logging: true
  project:
  name:
  group:

slurm:
  gpus: 4
  mem_per_gpu: 40
  time: 3600
  constraint:
  partition:
  comment:
  setup: []
  exclude: ''

dora:
  dir: ./outputs
  exclude: [
    'device', 'wandb.*', 'tensorboard.*', 'logging.*',
    'dataset.num_workers', 'eval.num_workers', 'special.*',
    'execute_only', 'execute_best', 'generate.every',
    'optim.eager_sync', 'profiler.*', 'deadlock.*',
    'num_threads', 'mp_start_method',
    'optim.epochs',
  ]
  use_rendezvous: false
  git_save: true
